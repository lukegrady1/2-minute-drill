name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: uv sync
      - run: uv run ruff check pipeline sim
      - run: uv run pytest -q pipeline   # sim tests need the exported data (data/ is not in git)
      - run: npm ci && npx tsc -p tsconfig.json --noEmit
